{{define "content"}}
<h1>Scrobble</h1>
<form class="search" method="get" action="/scrobble" role="search">
<label for="q">Song or artist, in any script</label>
<div class="search-row"><input type="text" id="q" name="q" value="{{.Query}}" autofocus><button type="submit">Search</button></div>
</form>

{{if .Query}}
{{if .Results}}
<form method="post" action="/scrobble">
<input type="hidden" name="q" value="{{.Query}}">
<div class="field"><label for="at">When</label><input type="datetime-local" id="at" name="at" max="{{.Now}}">
<p class="help">Leave empty for now.</p></div>
<div class="table-scroll">
<table class="table">
<thead><tr><th scope="col" class="wide">Song</th><th scope="col" class="wide">Artist</th><th scope="col" class="num">Listens</th><th scope="col" class="action"><span class="muted">Action</span></th></tr></thead>
<tbody>
{{range .Results}}<tr><td>{{template "name" (withVersion .Song .Version)}}</td><td>{{template "names" .Artists}}</td><td class="num">{{num .Listens}}</td><td class="action"><button type="submit" name="recording" value="{{.RecordingID}}">Scrobble</button></td></tr>
{{end}}</tbody>
</table>
</div>
</form>
{{else}}
<p>Nothing matches “{{.Query}}”.</p>
{{end}}
{{end}}
{{end}}
