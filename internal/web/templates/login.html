{{define "content"}}
<h1>Log in</h1>
<form class="form" method="post" action="/login">
<input type="hidden" name="next" value="{{.Next}}">
<div class="field"><label for="name">Name</label><input type="text" id="name" name="name" value="{{.Name}}" autocomplete="username" autocapitalize="none" required autofocus></div>
<div class="field"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required></div>
<button type="submit">Log in</button>
</form>
{{end}}
